name: WIP V11 compile and native regressions
on:
  push:
    branches: [work/rune-backtrace-untested-20261117]
permissions:
  contents: read
concurrency:
  group: wip-v11-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'philocalyst/rune' && github.ref == 'refs/heads/work/rune-backtrace-untested-20261117' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact event commit without retained credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # official v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Verify, build and run fixed native subset
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 scripts/ci-v11/run.py
