name: WIP fixed synthetic post-exec controls (49)
on:
  push:
    branches: [work/rune-backtrace-untested-20261117]
permissions:
  contents: read
concurrency:
  group: wip-exec-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admission:
    if: github.repository == 'philocalyst/rune' && github.ref == 'refs/heads/work/rune-backtrace-untested-20261117' && github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        group: [baseline, scalar_exec, scalar_other, process_alias, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact event commit without retained credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Build and check only fixed synthetic controls
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          ADMISSION_GROUP: ${{ matrix.group }}
        run: /usr/bin/timeout --signal=TERM --kill-after=5s 445s /usr/bin/python3 -I scripts/ci-exec-admission/run.py

  complete:
    needs: admission
    if: success() && github.repository == 'philocalyst/rune' && github.ref == 'refs/heads/work/rune-backtrace-untested-20261117' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Record completion only after all five fixed groups succeed
        run: /usr/bin/printf '%s\n' 'All 49 fixed synthetic controls passed across five groups; no GNU or Doom executed.'
