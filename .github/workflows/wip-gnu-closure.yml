name: WIP static GNU runtime dependency inspection
on:
  push:
    branches: [work/rune-backtrace-untested-20261117]
permissions:
  contents: read
concurrency:
  group: wip-gnu-closure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  closure:
    if: github.repository == 'philocalyst/rune' && github.ref == 'refs/heads/work/rune-backtrace-untested-20261117' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event commit without retained credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Authenticate inert payload and inspect exact hosted ELF closure
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: timeout --signal=TERM --kill-after=5s 570s python3 -I scripts/ci-gnu-closure/run.py

      - name: Save exact same-job static closure evidence only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gnu-static-closure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/closure.json
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/static-result.json
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/payload-result.json
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/authentication.json
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/provider-authentication.json
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/provenance.json
            ${{ runner.temp }}/rune-closure-evidence-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: false
          include-hidden-files: false
